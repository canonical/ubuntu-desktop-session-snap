name: build-snap
on:
  pull_request:
  push:
    branches:
      - main
      - 22
      - 24
      - desktop/26

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: snapcore/action-build@v1
      id: snapcraft
      with:
        snapcraft-channel: edge
    - name: Normalize snap filename
      if: github.ref_name == 'desktop/26'
      run: cp "${{ steps.snapcraft.outputs.snap }}" ubuntu-desktop-session.snap
    - name: Publish to desktop-26-latest release
      if: github.ref_name == 'desktop/26' && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view desktop-26-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
          || gh release create desktop-26-latest -R "$GITHUB_REPOSITORY" \
               --title "desktop/26 latest snap" \
               --notes "Rolling latest desktop/26 snap build; assets are replaced on every green build."
        gh release upload desktop-26-latest ubuntu-desktop-session.snap -R "$GITHUB_REPOSITORY" --clobber
    - uses: actions/upload-artifact@v4
      with:
        name: 'snap'
        path: ${{ steps.snapcraft.outputs.snap}}
        compression-level: 0 # No need to double-compress the snap
        retention-days: 7
