      - dbus-portal-documents
      - dbus-portal-tracker
      - dbus-portal-permission-store
      - dbus-portal-secret
  xdg-permission-store:
    command: run.sh /usr/libexec/xdg-permission-store
    daemon: dbus
    daemon-scope: user
    slots:
      - dbus-freedesktop-impl-portal-permission-store
    activates-on:
      - dbus-freedesktop-impl-portal-permission-store
    restart-delay: 1s
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - systemd-user-control
  xdg-desktop-portal-gtk:
    command: run.sh /usr/libexec/xdg-desktop-portal-gtk
    daemon: dbus
    daemon-scope: user
    slots:
      - dbus-freedesktop-impl-portal-gtk
    activates-on:
      - dbus-freedesktop-impl-portal-gtk
    restart-delay: 1s
    plugs:
      - account-control
      - home
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - systemd-user-control
      - wayland-client
      - dbus-portal-desktop
  xdg-desktop-portal-rewrite-launchers:
    command: run.sh /usr/libexec/xdg-desktop-portal-rewrite-launchers
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - systemd-user-control
  xdg-document-portal:
    command: run.sh /usr/libexec/xdg-document-portal
    daemon: dbus
    daemon-scope: user
    slots:
      - desktop
      - dbus-freedesktop-portal-documents
    activates-on:
      - dbus-freedesktop-portal-documents
    restart-delay: 1s
    # `snap run` privatizes XDG_RUNTIME_DIR to /run/user/<uid>/snap.<name>/
    # for every app (see the WAYLAND_DISPLAY comment in scripts/run.sh for
    # the same pattern applied to another well-known runtime path). But
    # xdg-document-portal's FUSE mount (and the D-Bus paths it hands out)
    # must land at the plain, global /run/user/<uid>/doc: that's the one
    # location snapd's own tooling (cmd_run.go's desktop-launch check, and
    # the `desktop` interface's AppArmor bind-mount rule) hardcodes for
    # every other snap to find the document portal. Override just this
    # app's view back to the real, unprivatized runtime dir so it
    # generates the correct global path; nothing else this daemon touches
    # (state under XDG_DATA_HOME/XDG_CONFIG_HOME, already redirected above)
    # depends on XDG_RUNTIME_DIR.
    environment:
      XDG_RUNTIME_DIR: /run/user/$SNAP_UID
    plugs:
      - account-control
      # The portal daemon opens user-selected files for its FUSE mount;
      # requesting apps still see only the documents granted to them.
      - home
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - systemd-user-control
      - fuse-device
      - dbus-portal-permission-store
  xdg-user-dirs-gtk-update:
    command: run.sh /usr/bin/xdg-user-dirs-gtk-update
    plugs:
      - user-dirs-defaults
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - systemd-user-control
      - wayland-client
      - home
  xdg-user-dirs-update:
    command: run.sh /usr/bin/xdg-user-dirs-update
    plugs:
      - user-dirs-defaults
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - systemd-user-control
      - home

