parts:
  gnome-session-patched:
    plugin: nil
    source: https://download.gnome.org/sources/gnome-session/50/gnome-session-50.0.tar.xz
    source-type: tar
    build-packages:
      - build-essential
      - gettext
      - libdbus-1-dev
      - libgl-dev
      - libgles-dev
      - libglib2.0-dev
      - libgnome-desktop-4-dev
      - libice-dev
      - libsm-dev
      - libsystemd-dev
      - meson
      - ninja-build
      - pkg-config
      - systemd-dev
      - xmlto
      - xsltproc
    override-build: |
      patch -p1 < "${CRAFT_PROJECT_DIR}/patches/gnome-session-dbus-request-shutdown.patch"
      patch -p1 < "${CRAFT_PROJECT_DIR}/patches/gnome-session-environment-broker.patch"
      meson setup build \
        --prefix=/usr \
        --libexecdir=libexec \
        -Ddocbook=false \
        -Dman=false \
        -Dmimeapps=false \
        -Dsystemduserunitdir=/usr/lib/systemd/user
      meson compile -C build gnome-session gnome-session-init-worker gnome-session-service
      install -D -m 0755 build/gnome-session/gnome-session \
        "${CRAFT_PART_INSTALL}/usr/bin/gnome-session"
      install -D -m 0755 build/gnome-session/gnome-session-init-worker \
        "${CRAFT_PART_INSTALL}/usr/libexec/ubuntu-desktop-session/gnome-session-init-worker"
      install -D -m 0755 build/gnome-session/gnome-session-service \
        "${CRAFT_PART_INSTALL}/usr/libexec/ubuntu-desktop-session/gnome-session-service"
  environment-broker:
    plugin: nil
    source: environment-broker/
    build-packages:
      - golang
    override-build: |
      cd "${CRAFT_PART_SRC}"
      go mod download
      CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o session-environment-broker .
      install -D -m 0755 session-environment-broker \
        "${CRAFT_PART_INSTALL}/usr/libexec/ubuntu-desktop-session/session-environment-broker"
  scripts:
    plugin: dump
    source: ./scripts
  fusermount3-shim:
    plugin: nil
    source: fusermount3-shim/
    build-packages:
      - golang
    override-build: |
      cd "${CRAFT_PART_SRC}"
      CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o fusermount3 .
      mkdir -p "${CRAFT_PART_INSTALL}/usr/libexec/ubuntu-desktop-session"
      install -m 755 fusermount3 "${CRAFT_PART_INSTALL}/usr/libexec/ubuntu-desktop-session/fusermount3"
  ubuntu-desktop-session:
    plugin: nil
    build-packages:
      - git
    override-build: |
      cd $CRAFT_PROJECT_DIR
      craftctl set version=$(date +%Y%m%d)+git$(git rev-parse --short HEAD)
