name: ubuntu-desktop-session
adopt-info: ubuntu-desktop-session
summary: Ubuntu Desktop Session for the Ubuntu Core Desktop
description: |
  A strictly confined Ubuntu Desktop session for Ubuntu Core Desktop.

grade: stable
confinement: strict
base: core26-desktop
build-base: core26
platforms:
  all:
    build-on: amd64
    build-for: all

environment:
  HOME: $SNAP_REAL_HOME
  XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
  XDG_CONFIG_HOME: $SNAP_USER_COMMON/.config
  XDG_DATA_HOME: $SNAP_USER_COMMON/.local/share
  XDG_STATE_HOME: $SNAP_USER_COMMON/.local/state

# Redirects /usr/bin/fusermount3 (present in the core26-desktop base) to
# our own shim, which talks to the privileged xdg-fuse-broker instead of
# relying on fusermount3's setuid bit (defeated by confinement -- see
# notes/resume2.txt). layout: bind-mounts are snap-global (not scoped per
# app), but xdg-document-portal is the only app in this snap that invokes
# FUSE/fusermount3, so this redirect is safe for the whole snap.
layout:
  /usr/bin/fusermount3:
    bind-file: $SNAP/usr/libexec/ubuntu-desktop-session/fusermount3

apps:
  ubuntu-desktop-session:
    command: run-session.sh
    slots:
      - wayland
      - x11
#      - dbus-gnome-mutter-service-channel
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - shell-session-locale-files
      - systemd-user-control

  gnome-terminal-server:
    command: run.sh /usr/libexec/gnome-terminal-server
    daemon: dbus
    daemon-scope: user
    activates-on:
      - dbus-gnome-terminal
    plugs:
      - wayland-client

  screencast-service:
    command: run.sh /usr/bin/gjs -m /usr/share/gnome-shell/org.gnome.Shell.Screencast
    daemon: dbus
    daemon-scope: user
    activates-on:
      - dbus-gnome-shell-screencast

  nautilus-service:
    command: run.sh /usr/bin/nautilus --gapplication-service
    daemon: dbus
    daemon-scope: user
    activates-on:
      - dbus-gnome-nautilus

  xdg-desktop-portal-gnome:
    command: run.sh /usr/libexec/xdg-desktop-portal-gnome
    daemon: dbus
    daemon-scope: user
    activates-on:
      - dbus-freedesktop-impl-portal-gnome
    restart-delay: 1s

  #xdg-desktop-portal-gtk:
  #  command: run.sh /usr/libexec/xdg-desktop-portal-gtk
  #  daemon: dbus
  #  daemon-scope: user
  #  activates-on:
  #    - dbus-freedesktop-impl-portal-gtk
  #  restart-delay: 1s

  ibus-service:
    command: run.sh /usr/bin/ibus-daemon --panel disable
    daemon: dbus
    daemon-scope: user
    activates-on:
      - dbus-ibus

  ibus-gtk3-service:
    command: run.sh /usr/libexec/ibus-extension-gtk3
    daemon: dbus
    daemon-scope: user
    activates-on:
      - dbus-ibus-gtk3

  ibus-portal-service:
    command: run.sh /usr/libexec/ibus-portal
    daemon: dbus
    daemon-scope: user
    activates-on:
      - dbus-ibus-portal

  colord:
    command: run.sh /usr/libexec/colord-session
    daemon: dbus
    daemon-scope: user
    activates-on:
      - dbus-colord

  dconf-service:
