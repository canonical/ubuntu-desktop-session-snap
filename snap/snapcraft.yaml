name: ubuntu-desktop-session
adopt-info: ubuntu-desktop-session
summary: Ubuntu Desktop Session for the Ubuntu Core Desktop
description: |
  A strictly confined Ubuntu Desktop session for Ubuntu Core Desktop.

grade: stable
confinement: strict
base: core26
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

environment:
  HOME: $SNAP_REAL_HOME
  XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
  XDG_CONFIG_HOME: $SNAP_USER_COMMON/.config
  XDG_DATA_HOME: $SNAP_USER_COMMON/.local/share
  XDG_STATE_HOME: $SNAP_USER_COMMON/.local/state
  PATH: "$SNAP/gnome/usr/bin:$SNAP/gnome/usr/sbin:$SNAP/gnome/bin:$SNAP/gnome/usr/libexec:$SNAP/gnome/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/glib-2.0:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  LD_LIBRARY_PATH: "$SNAP/gnome/usr/lib/gnome-shell:$SNAP/gnome/usr/lib/gnome-settings-daemon-50:$SNAP/gnome/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libunity:$SNAP/gnome/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/mutter-18:$SNAP/gnome/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/gnome/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/samba:$SNAP/gnome/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/gnome/usr/lib:$SNAP/gnome/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/gnome/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib:$SNAP/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/lib:/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/usr/lib:/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/lib"
  GBM_BACKENDS_PATH: "$SNAP/gnome/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gbm"
  LIBGL_DRIVERS_PATH: "$SNAP/gnome/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri"
  __EGL_VENDOR_LIBRARY_DIRS: "$SNAP/gnome/usr/share/glvnd/egl_vendor.d:$SNAP/gnome/etc/glvnd/egl_vendor.d"
  XKB_CONFIG_ROOT: "$SNAP/gnome/usr/share/X11/xkb"
  XCURSOR_PATH: "$SNAP/gnome/usr/share/icons:$SNAP/gnome/usr/share/pixmaps"
  LIBINPUT_QUIRKS_DIR: "$SNAP/gnome/usr/share/libinput"
  GI_TYPELIB_PATH: "$SNAP/gnome/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gjs/girepository-1.0:$SNAP/gnome/usr/lib/gnome-shell:$SNAP/gnome/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/mutter-18:$SNAP/gnome/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/girepository-1.0:$SNAP/gnome/usr/lib/girepository-1.0:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/girepository-1.0:/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/girepository-1.0"
  GNOME_SHELL_DATADIR: "$SNAP/gnome/usr/share/gnome-shell"
  LIBGWEATHER_LOCATIONS_PATH: "$SNAP/gnome/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgweather-4/Locations.bin"
  GSETTINGS_SCHEMA_DIR: "$SNAP/gnome/usr/share/glib-2.0/schemas"
  XDG_DATA_DIRS: "$SNAP/gnome/usr/share:$SNAP/usr/share:/var/lib/snapd/desktop"
  XDG_CONFIG_DIRS: "$SNAP/gnome/etc/xdg:$SNAP/gnome/usr/etc/xdg:/etc/xdg"

# Redirects /usr/bin/fusermount3 (present in the core26-desktop base) to
# our own shim, which talks to the privileged xdg-fuse-broker instead of
# relying on fusermount3's setuid bit (defeated by confinement -- see
# notes/resume2.txt). layout: bind-mounts are snap-global (not scoped per
# app), but xdg-document-portal is the only app in this snap that invokes
# FUSE/fusermount3, so this redirect is safe for the whole snap.
layout:
  /usr/share/backgrounds:
    bind: $SNAP/gnome/usr/share/backgrounds
  /usr/bin/fusermount3:
    bind-file: $SNAP/usr/libexec/ubuntu-desktop-session/fusermount3

apps:
  ubuntu-desktop-session:
    command: run-session.sh
    slots:
      - wayland
      - x11
#      - dbus-gnome-mutter-service-channel
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - dot-hidden
      - shell-session-locale-files
      - user-dirs-defaults
      - systemd-user-control

  gnome-terminal-server:
    command: run.sh /usr/libexec/gnome-terminal-server
    daemon: dbus
    daemon-scope: user
    activates-on:
      - dbus-gnome-terminal
    plugs:
      - home
      - shell-startup-files
      - wayland-client

  screencast-service:
    command: run.sh /usr/bin/gjs -m /usr/share/gnome-shell/org.gnome.Shell.Screencast
    daemon: dbus
    daemon-scope: user
    activates-on:
      - dbus-gnome-shell-screencast

  nautilus-service:
    command: run.sh /usr/bin/nautilus --gapplication-service
    daemon: dbus
    daemon-scope: user
    slots:
      - dbus-freedesktop-filemanager1
    plugs:
      - home
      - dot-local-share-nautilus
      - dot-hidden
    activates-on:
      - dbus-gnome-nautilus

  xdg-desktop-portal-gnome:
    command: run.sh /usr/libexec/xdg-desktop-portal-gnome
    daemon: dbus
    daemon-scope: user
    slots:
      - dbus-freedesktop-impl-portal-gnome
    activates-on:
      - dbus-freedesktop-impl-portal-gnome
    restart-delay: 1s
    plugs:
      - dbus-portal-desktop
      - dbus-gnome-shell-screenshot-client

  ibus-service:
    command: run.sh /usr/bin/ibus-daemon --panel disable
    daemon: dbus
    daemon-scope: user
    activates-on:
      - dbus-ibus

  ibus-gtk3-service:
    command: run.sh /usr/libexec/ibus-extension-gtk3
    daemon: dbus
    daemon-scope: user
    activates-on:
      - dbus-ibus-gtk3

  ibus-portal-service:
    command: run-ibus-portal.sh
    daemon: dbus
    daemon-scope: user
    plugs:
      - wayland-client
    activates-on:
      - dbus-ibus-portal

  colord:
    command: run.sh /usr/libexec/colord-session
